name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: true_doctor_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, redis, gd, bcmath, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Copy .env
        run: cp .env.example .env

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Build front-end assets (Vite)
        run: npm ci && npm run build

      - name: Dependency audit
        run: composer audit && npm audit --omit=dev --audit-level=high

      - name: Secrets scan
        run: composer secrets-scan

      - name: Empty/stub file check
        run: composer check-empty-files

      - name: Pint (style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: composer stan

      - name: Migrate fresh (MySQL, proves migrations aren't silently broken)
        env:
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: true_doctor_ci
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate:fresh --seed --force

      - name: Route cache smoke (no closures allowed in routes/)
        run: php artisan route:cache && php artisan route:clear

      - name: Test suite (SQLite in-memory, see phpunit.xml)
        # Folder by folder: the whole suite does not fit one 512 MB process.
        # Each shard also runs as its own job below, in parallel, on PHP 8.3.
        if: matrix.php == '8.2'
        run: bash scripts/ci/test-shard.sh all

      - name: Test suite on MySQL (row-lock semantics)
        if: matrix.php == '8.3'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: true_doctor_ci
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test --filter='BillingService|CardTransaction|StockService|AdmissionService|AppointmentService|IntegrityHardening|GatewayPayment|InvoicePayment'

  tests:
    # The suite in parallel shards, so a failure is reported in minutes and no
    # process needs more than 512 MB (scripts/ci/test-shard.sh).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, api, livewire, offline, feature]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, gd, bcmath, intl, sodium, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-8.3-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Shard ${{ matrix.shard }}
        run: bash scripts/ci/test-shard.sh ${{ matrix.shard }}
